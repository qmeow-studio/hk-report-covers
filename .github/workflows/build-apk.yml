name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', '*.kts', 'gradle.properties', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: >
          gradle assembleRelease --no-daemon
          -PverCode=${{ github.run_number }}
          -PdataRepo=${{ github.repository }}
          -PdataToken=${{ secrets.DATA_READ_TOKEN }}
      - run: cp app/build/outputs/apk/release/app-release.apk ReportCovers-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReportCovers-apk
          path: ReportCovers-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 年報封面庫 v1.0.${{ github.run_number }}
          files: ReportCovers-*.apk
